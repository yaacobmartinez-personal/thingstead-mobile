    <circle cx="512" cy="312" r="44"/><circle cx="685" cy="412" r="44"/><circle cx="685" cy="612" r="44"/>
    <circle cx="512" cy="712" r="44"/><circle cx="339" cy="612" r="44"/><circle cx="339" cy="412" r="44"/>
  </g>
  <g fill="#171C14">
    <rect x="418" y="420" width="188" height="48" rx="12"/>
    <rect x="487" y="420" width="50" height="184" rx="12"/>
    <rect x="442" y="574" width="140" height="48" rx="12"/>
  </g>
</g>
<text x="400" y="228" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="64" fill="#171C14">Thingstead</text>
<text x="402" y="290" font-family="Manrope, Arial, sans-serif" font-weight="500" font-size="30" fill="#6B7565">Events, tickets, and the door.</text>
